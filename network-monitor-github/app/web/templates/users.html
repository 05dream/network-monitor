{% extends 'base.html' %}
{% block title %}用户管理 - 核心网高可用监控系统{% endblock %}
{% block content %}
<h2 class="page-title">用户管理</h2>

<div class="card">
  <div class="toolbar">
    <span style="flex:1"></span>
    <button class="btn" onclick="openForm()">+ 新增用户</button>
  </div>
  <table class="grid">
    <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>创建时间</th><th>操作</th></tr></thead>
    <tbody id="tbody"><tr><td colspan="5" class="muted">加载中…</td></tr></tbody>
  </table>
</div>

<div class="modal-mask" id="mask">
  <div class="modal">
    <h3 id="formTitle">新增用户</h3>
    <input type="hidden" id="f_id">
    <label>用户名 *</label><input id="f_username">
    <label>密码 *（至少6位；编辑时留空表示不修改密码）</label><input id="f_password" type="password">
    <label>角色 *</label>
    <select id="f_role" style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:5px">
      <option value="viewer">viewer（查看者）</option>
      <option value="admin">admin（管理员）</option>
    </select>
    <div class="form-err" id="f_err"></div>
    <div class="actions">
      <button class="btn plain" onclick="closeForm()">取消</button>
      <button class="btn" onclick="save()">保存</button>
    </div>
  </div>
</div>

<script>
function tag(t, c) { return `<span class="tag ${c}">${t}</span>`; }

async function load() {
  const body = await (await fetch('/api/users')).json();
  const tb = document.getElementById('tbody');
  if (body.code !== 0) { tb.innerHTML = `<tr><td colspan="5">${body.msg}</td></tr>`; return; }
  tb.innerHTML = body.data.map(u => `<tr>
    <td>${u.id}</td><td>${u.username}${u.id === {{ g.user['id'] }} ? ' <span class="tag info">当前登录</span>' : ''}</td>
    <td>${u.role === 'admin' ? tag('管理员', 'ok') : tag('查看者', 'info')}</td>
    <td class="muted">${u.created_at}</td>
    <td>
      <a href="javascript:void(0)" onclick='openForm(${JSON.stringify(u)})'>编辑</a>
      <a href="javascript:void(0)" style="color:var(--danger)" onclick="del(${u.id},'${u.username}')">删除</a>
    </td>
  </tr>`).join('');
}

function openForm(u) {
  document.getElementById('f_err').textContent = '';
  document.getElementById('formTitle').textContent = u ? `编辑用户：${u.username}` : '新增用户';
  document.getElementById('f_id').value = u ? u.id : '';
  document.getElementById('f_username').value = u ? u.username : '';
  document.getElementById('f_username').disabled = !!u;   // 用户名不可改
  document.getElementById('f_password').value = '';
  document.getElementById('f_role').value = u ? u.role : 'viewer';
  document.getElementById('mask').classList.add('show');
}
function closeForm() { document.getElementById('mask').classList.remove('show'); }

async function save() {
  const id = document.getElementById('f_id').value;
  const payload = {
    username: document.getElementById('f_username').value,
    password: document.getElementById('f_password').value,
    role: document.getElementById('f_role').value,
  };
  const res = await fetch(id ? `/api/users/${id}` : '/api/users', {
    method: id ? 'PUT' : 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload),
  });
  const body = await res.json();
  if (body.code !== 0) { document.getElementById('f_err').textContent = body.msg; return; }
  closeForm(); load();
}

async function del(id, name) {
  if (!confirm(`确认删除用户 ${name}？`)) return;
  const body = await (await fetch(`/api/users/${id}`, {method: 'DELETE'})).json();
  if (body.code !== 0) alert(body.msg);
  load();
}

load();
</script>
{% endblock %}
