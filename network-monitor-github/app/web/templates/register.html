{% extends 'base.html' %}
{% block title %}注册 - 核心网高可用监控系统{% endblock %}
{% block bare %}
<div class="login-wrap">
  <form class="login-card" method="post">
    <h1>注册账号</h1>
    <p class="sub">企业核心网高可用路由监控与故障分析系统</p>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}
    <label>用户名</label>
    <input type="text" name="username" required autofocus maxlength="30">
    <label>密码</label>
    <input type="password" name="password" required minlength="6">
    <label>确认密码</label>
    <input type="password" name="password2" required minlength="6">
    <button type="submit">注 册</button>
    <p class="hint">已有账号？<a href="{{ url_for('auth.login') }}">返回登录</a></p>
  </form>
</div>
{% endblock %}
